<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>莎翁字母表</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dcb8;--paper:#f8efd9;--ink:#2a1d14;--sub:#6a5440;--wine:#7a1e2c;--gold:#a8832f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17100c;--paper:#26190f;--ink:#f0e2c0;--sub:#b9a581;--wine:#e39aa5;--gold:#d4a84a}}
:root[data-theme="dark"]{--bg:#17100c;--paper:#26190f;--ink:#f0e2c0;--sub:#b9a581;--wine:#e39aa5;--gold:#d4a84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,var(--paper),var(--bg) 70%) fixed;color:var(--ink);font-family:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;border-bottom:4px double var(--gold);padding-bottom:14px;margin-bottom:20px}
h1{font-family:"Cinzel","Noto Serif TC",serif;font-weight:700;font-size:clamp(1.6rem,4.5vw,2.6rem);margin:0;color:var(--wine);letter-spacing:.06em}
.sub{font-style:italic;font-size:1.3rem;margin:2px 0 0}
p.hint{margin:6px 0 0;color:var(--sub);font-family:"Noto Serif TC",serif;font-size:.95rem}
.layout{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
.layout.open{grid-template-columns:1fr 340px}
#ov{position:sticky;top:12px;z-index:5}
#ov[hidden]{display:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
button.tile{background:var(--paper);color:var(--wine);border:2px solid var(--gold);border-radius:4px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--gold);padding:16px 4px;font:inherit;cursor:pointer;transition:transform .12s}
button.tile:active{transform:scale(.94)}
button.tile:focus-visible,.bar button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.tile.sel{background:var(--wine);color:var(--paper);box-shadow:inset 0 0 0 4px var(--wine),inset 0 0 0 5px var(--paper)}
.big{font-family:"Cinzel",serif;font-weight:700;font-size:2.5rem;line-height:1}
.lc{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.15em}
.card{background:var(--paper);border:5px double var(--gold);padding:20px 16px 16px;text-align:center;max-height:calc(100vh - 24px);overflow-y:auto}
#cL{font-family:"Cinzel",serif;font-weight:700;font-size:4.2rem;line-height:1;color:var(--wine)}
#cE{display:block;width:100%;max-width:280px;height:auto;margin:8px auto;border:3px solid var(--gold)}
#cW{font-weight:700;font-size:2.6rem;line-height:1.1}
#cS{font-family:"Noto Serif TC",serif;font-size:.95rem;color:var(--sub);margin:8px 0 12px;line-height:1.6}
.quote{border-top:1px solid var(--gold);margin:0 0 16px;padding-top:12px}
#cQ{font-style:italic;font-weight:500;font-size:1.3rem;line-height:1.35;margin:0 0 6px}
#cT{font-family:"Noto Serif TC",serif;font-size:.9rem;line-height:1.6;margin:0 0 6px}
#cA{font-family:"Noto Serif TC",serif;font-size:.8rem;color:var(--sub);margin:0}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button{background:transparent;color:var(--ink);border:2px solid var(--gold);border-radius:3px;padding:8px 14px;font-family:"Noto Serif TC",serif;font-size:.95rem;cursor:pointer}
.bar+.bar{margin-top:8px}
.bar.nav #close{flex:1}
.bar.audio button{flex:1;background:var(--wine);color:var(--paper);border-color:var(--wine)}
@media (prefers-reduced-motion:reduce){button.tile{transition:none}}
@media (max-width:720px){.layout.open{grid-template-columns:1fr}#ov{order:-1}.card{padding:10px;max-height:52vh}#cL{font-size:2.4rem}#cE{max-width:150px;margin:2px auto}#cW{font-size:1.7rem}#cS{margin:4px 0 8px;font-size:.85rem}.quote{margin-bottom:10px;padding-top:8px}#cQ{font-size:1.05rem}#cT{font-size:.8rem}#cA{font-size:.72rem}.bar button{padding:6px 10px;font-size:.85rem}}
</style>
</head>
<body>
<main>
<header>
<h1>莎翁字母表</h1>
<p class="sub">The Bard’s Alphabet</p>
<p class="hint">點一個字母,翻開一張莎士比亞字卡。</p>
</header>
<div class="layout" id="lay">
<div id="grid"></div>
<div id="ov" hidden>
<div class="card" role="region" aria-label="字卡">
<div id="cL"></div>
<img id="cE" width="300" height="225" alt="">
<div id="cW"></div>
<div id="cS"></div>
<div class="quote">
<p id="cQ"></p>
<p id="cT"></p>
<p id="cA"></p>
</div>
<div class="bar nav">
<button type="button" id="prev" aria-label="上一個">◀</button>
<button type="button" id="close">關閉</button>
<button type="button" id="next" aria-label="下一個">▶</button>
</div>
<div class="bar audio">
<button type="button" id="replay">🔊 聽單字</button>
<button type="button" id="readq">🎭 聽金句</button>
</div>
</div>
</div>
</div>
</main>
<script>
var words=["Aroint", "Bodkin", "Coil", "Dudgeon", "Equivocator", "Fardel", "Gossamer", "Hurlyburly", "Incarnadine", "Jocund", "Knell", "Lily-livered", "Mewling", "Nuncle", "Orisons", "Petard", "Quintessence", "Rue", "Surfeit", "Trammel", "Unsex", "Vaulting", "Wanton", "Xanthippe", "Yeoman", "Zenith"];
var note=["「滾開!」,《馬克白》中女巫驅趕人的古語", "短劍、錐子,《哈姆雷特》中一根小短劍就能了結生命", "塵世的紛擾,出自《哈姆雷特》", "匕首的刀柄,出自《馬克白》", "說話模稜兩可的人,《馬克白》門房的諷刺", "包袱、重擔,出自《哈姆雷特》", "蛛絲般輕薄的東西,出自《李爾王》", "喧鬧、混亂,《馬克白》女巫開場的詞", "染成血紅色,出自《馬克白》", "愉快的、歡樂的,出自《羅密歐與茱麗葉》", "喪鐘,出自《馬克白》", "膽小的(肝臟像百合一樣蒼白),出自《馬克白》", "(嬰兒)哭鬧,出自《皆大歡喜》", "「叔叔」的俏皮說法,《李爾王》中弄臣對國王的稱呼", "禱告,出自《哈姆雷特》", "古時炸城門用的小炸藥,出自《哈姆雷特》", "精華、精髓,出自《哈姆雷特》", "芸香,象徵悔恨,出自《哈姆雷特》", "過量、吃到膩,出自《第十二夜》", "束縛、困住,出自《馬克白》", "褪去女性的柔弱,《馬克白》夫人召喚黑暗力量時說的話", "躍起的、過度的,出自《馬克白》", "任性嬉戲的、放縱的,出自《李爾王》", "贊西佩,蘇格拉底的悍妻,《馴悍記》曾提到她", "自耕農;yeoman’s service 指忠實可靠的幫助,出自《哈姆雷特》", "頂點、天頂,出自《暴風雨》"];
var qt=["‘Aroint thee, witch!’ the rump-fed ronyon cries.", "When he himself might his quietus make with a bare bodkin?", "When we have shuffled off this mortal coil, must give us pause.", "And on thy blade and dudgeon gouts of blood, which was not so before.", "Faith, here’s an equivocator, that could swear in both the scales against either scale.", "Who would these fardels bear, to grunt and sweat under a weary life?", "Hadst thou been aught but gossamer, feathers, air…", "When the hurlyburly’s done, when the battle’s lost and won.", "This my hand will rather the multitudinous seas incarnadine, making the green one red.", "Night’s candles are burnt out, and jocund day stands tiptoe on the misty mountain tops.", "Hear it not, Duncan; for it is a knell that summons thee to heaven or to hell.", "Go prick thy face, and over-red thy fear, thou lily-liver’d boy.", "At first the infant, mewling and puking in the nurse’s arms.", "Can you make no use of nothing, nuncle?", "Nymph, in thy orisons be all my sins remembered.", "For ’tis the sport to have the engineer hoist with his own petard.", "What a piece of work is a man! … And yet, to me, what is this quintessence of dust?", "There’s rue for you; and here’s some for me: we may call it herb of grace o’ Sundays.", "If music be the food of love, play on; give me excess of it, that, surfeiting, the appetite may sicken, and so die.", "If the assassination could trammel up the consequence, and catch with his surcease success.", "Come, you spirits that tend on mortal thoughts, unsex me here.", "I have no spur to prick the sides of my intent, but only vaulting ambition, which o’erleaps itself and falls on the other.", "As flies to wanton boys are we to the gods; they kill us for their sport.", "As curst and shrewd as Socrates’ Xanthippe, or a worse, she moves me not.", "It did me yeoman’s service.", "I find my zenith doth depend upon a most auspicious star."];
var zh=["「滾開,女巫!」那個吃得滿身肥肉的臭婆娘喊道。", "他明明可以只用一根小匕首,就為自己了結一切?", "當我們擺脫了這塵世的紛擾,就不得不停下來想一想。", "你的刀刃和刀柄上有一滴滴鮮血,剛才還不在那裡。", "說真的,來了個說話模稜兩可的人,能在天秤的兩端各發一個互相矛盾的誓。", "誰願意扛著這些重擔,在疲憊的人生裡呻吟流汗?", "你若不是蛛絲、羽毛或空氣……(從那麼高摔下來,早就像蛋一樣碎了)", "當喧鬧結束,當戰爭有輸有贏。", "我這隻手寧可把無邊的大海都染成血紅,讓綠色變成紅色。", "夜晚的燭火已經燃盡,歡快的白晝踮著腳尖,站在朦朧的山頭。", "別聽,鄧肯;那是一聲喪鐘,召喚你上天堂或下地獄。", "去刺破你的臉,讓它紅起來蓋住你的恐懼,你這膽小鬼。", "起初是嬰兒,在奶媽的懷裡哭鬧和吐奶。", "你就不能從「什麼都沒有」裡找到一點用處嗎,叔叔?", "仙女啊,在你的禱告中,請記得我的一切罪過。", "因為最有趣的,就是讓工兵被自己的炸藥炸上天。", "人是多麼了不起的傑作!……可是對我來說,這塵土的精華又算什麼?", "這是給你的芸香,這是我的:我們可以在星期天叫它「恩典之草」。", "如果音樂是愛情的食糧,就繼續奏下去吧;多給我一些,讓我吃到膩,胃口病倒,然後消失。", "如果這場刺殺能把後果牢牢困住,用他的死換來成功。", "來吧,你們這些伺候凡人念頭的惡靈,在這裡讓我褪去女性的柔弱。", "我沒有刺激意圖的馬刺,只有一股過度躍起的野心,它一躍就跳過頭,摔到另一邊去。", "我們之於眾神,就像蒼蠅之於頑皮的男孩;他們殺死我們,只是為了好玩。", "就算她像蘇格拉底的贊西佩一樣又兇又悍,甚至更糟,也動搖不了我。", "它幫了我大忙,盡了忠實的本分。", "我發現我的命運頂點,正取決於一顆極其吉利的星。"];
var src=["第一女巫,《馬克白》第 1 幕第 3 景", "哈姆雷特,《哈姆雷特》第 3 幕第 1 景", "哈姆雷特,《哈姆雷特》第 3 幕第 1 景", "馬克白,《馬克白》第 2 幕第 1 景", "門房,《馬克白》第 2 幕第 3 景", "哈姆雷特,《哈姆雷特》第 3 幕第 1 景", "艾德加,《李爾王》第 4 幕第 6 景", "女巫們,《馬克白》第 1 幕第 1 景", "馬克白,《馬克白》第 2 幕第 2 景", "羅密歐,《羅密歐與茱麗葉》第 3 幕第 5 景", "馬克白,《馬克白》第 2 幕第 1 景", "馬克白,《馬克白》第 5 幕第 3 景", "傑奎斯,《皆大歡喜》第 2 幕第 7 景", "弄臣,《李爾王》第 1 幕第 4 景", "哈姆雷特,《哈姆雷特》第 3 幕第 1 景", "哈姆雷特,《哈姆雷特》第 3 幕第 4 景", "哈姆雷特,《哈姆雷特》第 2 幕第 2 景", "奧菲莉亞,《哈姆雷特》第 4 幕第 5 景", "奧西諾公爵,《第十二夜》第 1 幕第 1 景", "馬克白,《馬克白》第 1 幕第 7 景", "馬克白夫人,《馬克白》第 1 幕第 5 景", "馬克白,《馬克白》第 1 幕第 7 景", "葛羅斯特,《李爾王》第 4 幕第 1 景", "彼特魯喬,《馴悍記》第 1 幕第 2 景", "哈姆雷特,《哈姆雷特》第 5 幕第 2 景", "普洛斯彼羅,《暴風雨》第 1 幕第 2 景"];
var grid=document.getElementById("grid"),ov=document.getElementById("ov"),lay=document.getElementById("lay"),cur=0;
var player=null;
function stopAudio(){if(player){player.pause();player=null}}
function play(kind){
  stopAudio();
  player=new Audio("audio/"+String.fromCharCode(65+cur)+"_"+words[cur]+"_"+kind+".mp3");
  player.play().catch(function(){});
}
function say(){play("word")}
function show(i){
  cur=(i+26)%26;
  var L=String.fromCharCode(65+cur);
  document.getElementById("cL").innerHTML=L+'<span class="lc">'+L.toLowerCase()+'</span>';
  var im=document.getElementById("cE");
  im.src="images/"+L+"_"+words[cur]+".jpg";
  im.alt=words[cur];
  document.getElementById("cW").textContent=words[cur];
  document.getElementById("cS").textContent=note[cur];
  document.getElementById("cQ").textContent="“"+qt[cur]+"”";
  document.getElementById("cT").textContent=zh[cur];
  document.getElementById("cA").textContent="—— "+src[cur];
  ov.hidden=false;
  lay.classList.add("open");
  Array.prototype.forEach.call(grid.children,function(t,j){t.classList.toggle("sel",j===cur)});
  stopAudio();
}
function hide(){
  ov.hidden=true;
  lay.classList.remove("open");
  Array.prototype.forEach.call(grid.children,function(t){t.classList.remove("sel")});
  stopAudio();
}
document.getElementById("prev").addEventListener("click",function(){show(cur-1)});
document.getElementById("next").addEventListener("click",function(){show(cur+1)});
document.getElementById("replay").addEventListener("click",say);
document.getElementById("readq").addEventListener("click",function(){play("quote")});
document.getElementById("close").addEventListener("click",hide);
document.addEventListener("keydown",function(e){if(e.key==="Escape")hide()});
words.forEach(function(w,i){
  var L=String.fromCharCode(65+i);
  var b=document.createElement("button");
  b.className="tile";b.type="button";
  b.setAttribute("aria-label","字母 "+L);
  b.innerHTML='<span class="big">'+L+'<span class="lc">'+L.toLowerCase()+'</span></span>';
  b.addEventListener("click",function(){show(i)});
  grid.appendChild(b);
});
</script>
</body>
</html>
